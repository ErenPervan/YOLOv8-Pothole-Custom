# Ultralytics YOLOv8n-seg-custom architecture
# Based on paper: An Enhanced YOLOv8 Model for Pothole Detection [cite: 1]
# Modifications: DSConv, SimAM added. Activation is SiLU (default).

# Parameters
nc: 80  # number of classes (Eğitimde kendi veri setine göre override edilecek)
scales: # model compound scaling constants, i.e. 'n'
  n: [0.33, 0.25, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [cite_start][-1, 1, Conv, [64, 3, 2]]  # 0-P1/2 (Makalede ilk katman standard Conv [cite: 327])
  - [cite_start][-1, 1, DSConv, [128, 3, 2]]  # 1-P2/4 (Makale: Backbone'da DSConv kullanımı [cite: 323])
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, DSConv, [256, 3, 2]]  # 3-P3/8
  - [cite_start][-1, 6, C2f_SimAM, [256, True]] # 4 (Makale: C2f bloklarına SimAM entegrasyonu [cite: 328])
  - [-1, 1, DSConv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f_SimAM, [512, True]] # 6
  - [-1, 1, DSConv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f_SimAM, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [cite_start][-1, 3, C2f_SimAM, [512]]  # 12 (Neck kısmında SimAM kullanımı [cite: 330])

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f_SimAM, [256]]  # 15 (P3/8-small)

  - [-1, 1, DSConv, [256, 3, 2]] # 16 (Head kısmında DSConv kullanımı)
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f_SimAM, [512]]  # 18 (P4/16-medium)

  - [-1, 1, DSConv, [512, 3, 2]] # 19
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f_SimAM, [1024]]  # 21 (P5/32-large)

  - [[15, 18, 21], 1, Segment, [nc, 32, 256]]  # Segment head